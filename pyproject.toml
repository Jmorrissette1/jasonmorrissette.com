[project]
name = "jasonmorrissette-com"
version = "0.1.0"
description = "Personal portfolio and cloud security case study for jasonmorrissette.com"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"