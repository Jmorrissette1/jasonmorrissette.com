[project]
name = "jasonmorrissette-com"
version = "0.1.0"
description = "Personal portfolio and cloud security case study for jasonmorrissette.com"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.165.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx2>=2.16.2",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
